<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天体・太陽観察 20年アーカイブ Viewer</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1a1a;
      color: #eee;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #ffa500;
      margin-bottom: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    /* 年月ドロップダウン・フィルターエリア */
    .filter-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .filter-box label {
      font-weight: bold;
      color: #ffa500;
    }
    .filter-box select {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 15px;
      border-radius: 4px;
      font-size: 1em;
      cursor: pointer;
    }
    .filter-box select:focus {
      outline: none;
      border-color: #ffa500;
    }
    /* 日付ボタンエリア */
    .date-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 25px;
      padding: 15px;
      background: #222;
      border-radius: 8px;
      min-height: 40px;
    }
    .date-btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .date-btn:hover, .date-btn.active {
      background: #ffa500;
      color: #000;
      border-color: #ffa500;
      font-weight: bold;
    }
    /* キャプションエリア */
    .caption-box {
      background: #222;
      border-left: 4px solid #ffa500;
      padding: 15px;
      margin-bottom: 25px;
      font-size: 0.95em;
      line-height: 1.5;
      border-radius: 0 4px 4px 0;
    }
    /* ギャラリー（サムネイル）グリッド */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }
    .thumb-card {
      background: #2a2a2a;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }
    .thumb-card:hover {
      transform: scale(1.03);
    }
    .thumb-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .thumb-info {
      padding: 8px;
      font-size: 0.8em;
      color: #aaa;
      text-align: center;
      word-break: break-all;
    }
    /* 拡大モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(255,165,0,0.4);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>天体・太陽観察 20年アーカイブ Viewer</h1>
  
  <!-- 年月フィルター -->
  <div class="filter-box">
    <label for="yearSelect">年：</label>
    <select id="yearSelect" onchange="onYearChange()"></select>

    <label for="monthSelect">月：</label>
    <select id="monthSelect" onchange="onMonthChange()"></select>

    <span id="dataCount" style="font-size:0.9em; color:#aaa; margin-left:10px;"></span>
  </div>

  <!-- 日付選択ボタン -->
  <div class="date-selector" id="dateSelector">読み込み中...</div>

  <!-- 撮影データ表示エリア -->
  <div class="caption-box" id="captionBox">日付を選択してください。</div>

  <!-- 画像ギャラリー -->
  <div class="gallery" id="gallery"></div>
</div>

<!-- 拡大モーダル -->
<div class="modal" id="imageModal" onclick="closeModal()">
  <img id="modalImg" src="" alt="拡大画像">
</div>

<script>
  let allData = [];
  let currentFilteredData = [];

  // data.json 読み込み
  fetch('data.json')
    .then(res => res.json())
    .then(data => {
      allData = data;
      document.getElementById('dataCount').innerText = `（全 ${data.length} 日分のデータ）`;
      initYearSelect();
    })
    .catch(err => {
      document.getElementById('dateSelector').innerText = 'data.json の読み込みに失敗しました。';
      console.error(err);
    });

  // 「年」選択肢の作成
  function initYearSelect() {
    const years = [...new Set(allData.map(item => item.date.substring(0, 4)))].sort().reverse();
    const yearSelect = document.getElementById('yearSelect');
    yearSelect.innerHTML = '';

    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.innerText = `${y} 年`;
      yearSelect.appendChild(opt);
    });

    if (years.length > 0) {
      onYearChange(); // 最新年を初期選択
    }
  }

  // 年が変更されたとき、「月」選択肢を更新
  function onYearChange() {
    const selectedYear = document.getElementById('yearSelect').value;
    const yearData = allData.filter(item => item.date.startsWith(selectedYear));
    
    const months = [...new Set(yearData.map(item => item.date.substring(5, 7)))].sort();
    const monthSelect = document.getElementById('monthSelect');
    monthSelect.innerHTML = '';

    months.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.innerText = `${parseInt(m)} 月`;
      monthSelect.appendChild(opt);
    });

    if (months.length > 0) {
      // 一番最後の月（最新月）を初期選択
      monthSelect.value = months[months.length - 1];
      onMonthChange();
    }
  }

  // 月が変更されたとき、該当する日のボタンを生成
  function onMonthChange() {
    const selectedYear = document.getElementById('yearSelect').value;
    const selectedMonth = document.getElementById('monthSelect').value;
    const targetYM = `${selectedYear}-${selectedMonth}`;

    currentFilteredData = allData.filter(item => item.date.startsWith(targetYM));
    
    const selector = document.getElementById('dateSelector');
    selector.innerHTML = '';

    if (currentFilteredData.length === 0) {
      selector.innerText = '該当するデータがありません。';
      document.getElementById('gallery').innerHTML = '';
      document.getElementById('captionBox').innerText = '';
      return;
    }

    currentFilteredData.forEach((item, index) => {
      const btn = document.createElement('button');
      btn.className = 'date-btn';
      btn.innerText = item.date;
      btn.onclick = () => selectDate(index);
      selector.appendChild(btn);
    });

    // 月の先頭（1日目）を自動選択
    selectDate(0);
  }

  // 日付が選択されたとき
  function selectDate(index) {
    const item = currentFilteredData[index];

    // ボタン表示の切り替え
    const buttons = document.querySelectorAll('.date-btn');
    buttons.forEach((btn, idx) => {
      btn.classList.toggle('active', idx === index);
    });

    // 撮影データの表示
    document.getElementById('captionBox').innerText = item.caption ? item.caption : '（撮影データなし）';

    // サムネイル画像の表示
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';

    item.images.forEach(imgUrl => {
      const card = document.createElement('div');
      card.className = 'thumb-card';
      card.onclick = () => openModal(imgUrl);

      const filename = imgUrl.split('/').pop();

      card.innerHTML = `
        <img src="${imgUrl}" alt="${filename}" loading="lazy">
        <div class="thumb-info">${filename}</div>
      `;
      gallery.appendChild(card);
    });
  }

  // 画像拡大表示
  function openModal(url) {
    document.getElementById('modalImg').src = url;
    document.getElementById('imageModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('imageModal').style.display = 'none';
  }
</script>

</body>
</html>
